        <h1>Loyalties — digital stamp cards for local businesses</h1>
        <p>
          Loyalties is a wallet-based loyalty card for cafes, restaurants, bars, bakeries, salons and other local venues. Customers scan a QR code, add your branded stamp card to Apple Wallet or Google Wallet, and earn a reward as they come back. There is no app to download.
        </p>
        <p>
          Owners design a card with their logo, colours and reward, then stamp visits from a phone or tablet. The free plan covers the card, join page, wallet passes and members list. Pro adds email campaigns so you can invite opted-in regulars back for quiet nights and events.
